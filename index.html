<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>未来科技 · 展示页面</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --text: #f8fafc;
      --muted: #a5b4fc;
      --bg: #080b18;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.14);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.25), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.2), transparent 30%),
        var(--bg);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    nav {
      width: min(1120px, 90%);
      margin: auto;
      height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      color: transparent;
    }

    nav ul {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      transition: .3s;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      width: min(1120px, 90%);
      min-height: 650px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 60px;
    }

    .tag {
      display: inline-block;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid rgba(167, 139, 250, .4);
      border-radius: 999px;
      color: #c4b5fd;
      background: rgba(139, 92, 246, .12);
      font-size: 14px;
    }

    h1 {
      max-width: 650px;
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.08;
      letter-spacing: -3px;
    }

    h1 span {
      background: linear-gradient(90deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 560px;
      margin: 25px 0 32px;
      color: #94a3b8;
      font-size: 18px;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: .3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 10px 30px rgba(99, 102, 241, .3);
    }

    .btn-secondary {
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
    }

    .visual {
      position: relative;
      height: 430px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #fff, transparent 8%),
        linear-gradient(135deg, #8b5cf6, #06b6d4);
      box-shadow:
        0 0 50px rgba(139, 92, 246, .5),
        0 0 120px rgba(6, 182, 212, .25);
      animation: float 5s ease-in-out infinite;
    }

    .orbit {
      position: absolute;
      width: 380px;
      height: 150px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
      transform: rotate(-25deg);
      animation: rotate 9s linear infinite;
    }

    .orbit::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 25px #22d3ee;
    }

    .glass-card {
      position: absolute;
      right: 0;
      bottom: 20px;
      padding: 22px;
      width: 210px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(15, 23, 42, .65);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
      animation: float 4s ease-in-out infinite reverse;
    }

    .glass-card small {
      color: #94a3b8;
    }

    .glass-card strong {
      display: block;
      margin-top: 8px;
      font-size: 30px;
    }

    .section {
      width: min(1120px, 90%);
      margin: 60px auto 100px;
    }

    .section-title {
      margin-bottom: 28px;
      text-align: center;
      font-size: 36px;
    }

    .section-title span {
      color: #a78bfa;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      padding: 28px;
      min-height: 210px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(12px);
      transition: .3s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(167, 139, 250, .6);
      background: rgba(255,255,255,.12);
    }

    .icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 14px;
      font-size: 24px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .card p {
      color: #94a3b8;
      line-height: 1.7;
    }

    footer {
      padding: 28px;
      border-top: 1px solid rgba(255,255,255,.1);
      color: #64748b;
      text-align: center;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-18px);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(-25deg) rotate(0deg);
      }
      to {
        transform: rotate(-25deg) rotate(360deg);
      }
    }

    @media (max-width: 760px) {
      nav ul {
        display: none;
      }

      .hero {
        min-height: auto;
        padding: 70px 0;
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero p {
        margin-left: auto;
        margin-right: auto;
      }

      .buttons {
        justify-content: center;
      }

      .visual {
        height: 350px;
      }

      .orb {
        width: 220px;
        height: 220px;
      }

      .orbit {
        width: 300px;
      }

      .glass-card {
        right: 5%;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <nav>
    <div class="logo">NOVA</div>

    <ul>
      <li><a href="#home">首页</a></li>
      <li><a href="#features">特色</a></li>
      <li><a href="#contact">联系</a></li>
    </ul>
  </nav>

  <main id="home">
    <section class="hero">
      <div>
        <div class="tag">✨ 探索无限可能</div>

        <h1>
          让创意<br />
          <span>闪耀起来</span>
        </h1>

        <p>
          一个简洁、现代且充满未来感的数字展示空间，
          用设计连接灵感，用技术创造更好的体验。
        </p>

        <div class="buttons">
          <a href="#features" class="btn btn-primary">开始探索 →</a>
          <a href="#contact" class="btn btn-secondary">了解更多</a>
        </div>
      </div>

      <div class="visual">
        <div class="orbit"></div>
        <div class="orb"></div>

        <div class="glass-card">
          <small>项目完成度</small>
          <strong>98%</strong>
          <small>持续创造精彩体验</small>
        </div>
      </div>
    </section>

    <section class="section" id="features">
      <h2 class="section-title">我们的<span>特色</span></h2>

      <div class="cards">
        <div class="card">
          <div class="icon">⚡</div>
          <h3>极速体验</h3>
          <p>
            简洁高效的页面结构，带来流畅自然的交互体验。
          </p>
        </div>

        <div class="card">
          <div class="icon">🎨</div>
          <h3>精致设计</h3>
          <p>
            通过渐变、玻璃拟态和动画效果，打造现代视觉风格。
          </p>
        </div>

        <div class="card">
          <div class="icon">🚀</div>
          <h3>无限可能</h3>
          <p>
            可轻松扩展为个人主页、产品官网、作品集或品牌页面。
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer id="contact">
    © 2026 NOVA · Designed with creativity
  </footer>
</body>
</html>
